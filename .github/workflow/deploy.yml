name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0
      - run: dotnet workload install wasm-tools
      - run: dotnet publish N4RNACSite.Browser -c Release
      
      - name: Prepare Pages files
        run: |
          OUTPUT="N4RNACSite.Browser/bin/Release/net11.0-browser/publish/wwwroot"
          touch $OUTPUT/.nojekyll
          cp $OUTPUT/index.html $OUTPUT/404.html
          
      - uses: actions/upload-pages-artifact@v3
        with:
          path: N4RNACSite.Browser/bin/Release/net11.0-browser/publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4